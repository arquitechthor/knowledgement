<h1>Articles A &amp; An</h1>
<p><strong>A</strong> is used when the following word star with a <strong>consonant</strong>.<br />
e.g.: A game, a house, or a dog.</p>
<p><strong>An</strong> is used when the following word starts with a <strong>vowel</strong>.<br />
e.g.: An aunt, an architect, or an icon.</p>
<p><strong>BUT</strong></p>
<p>There are two exceptions</p>
<ul>
<li>A university</li>
<li>A username.</li>
</ul>
